    function renderPointer(id,node,fallback){
      const target=$(id);
      if(node)target.replaceChildren(el('b','pointer-id',node.id),el('span','pointer-name',node.label||''));
      else target.replaceChildren(el('span','pointer-name',fallback));
    }
    function renderLegend(){
      const heading=el('h2','',t('图例')),grid=el('div','legend-grid'),sample=el('span','pips'),marks=el('div','legend-pips'),lines=el('div','legend-lines'),caption=el('span','eyebrow','Legend');
      caption.setAttribute('aria-hidden','true');heading.append(caption);
      for(const status of ['done','pending','current','next','available','locked','blocked','unknown']){const item=el('div','legend-item');item.append(hex(STATUS_KIND[status]),document.createTextNode(labels[status]));grid.append(item);}
      for(const kind of ['on','on','wait','none']){const pip=el('i','pip');pip.dataset.kind=kind;sample.append(pip);}
      marks.append(sample,document.createTextNode([t('开发'),t('验证'),t('验收'),t('交付')].join(' · ')));
      for(const [kind,label] of [['',t('前置依赖')],['sequence',t('主线顺序')],['attachment',t('位置关联')]]){const row=el('div','legend-line');row.append(el('i',kind),document.createTextNode(label));lines.append(row);}
      $('legend').replaceChildren(heading,grid,el('div','legend-rule'),marks,el('p','legend-note',t('牌面右上四格依次记录这四项状态。')),el('div','legend-rule'),lines);
    }
    function setLegend(open,remember=true){
      $('legend').hidden=!open;
      $('legend-button').setAttribute('aria-pressed',String(open));
      if(remember)try{localStorage.setItem('vmt-legend',open?'1':'0');}catch{}
    }

    // ---------- Render and sync ----------
    const fingerprint=node=>JSON.stringify([node.status,node.states,node.label]);
    function render(){
      mission=buildMission(plan,{workstream:selectedView,language});
      if(selectedView!=='all'&&!mission.nodes.some(node=>streamOf(node)===selectedView)){selectedView='all';mission=buildMission(plan,{workstream:selectedView,language});}
      byKey=new Map(mission.nodes.map(node=>[node.key,node]));
      const changed=fingerprints.size?mission.nodes.filter(node=>fingerprints.get(node.key)!==fingerprint(node)).map(node=>node.key):[];
      fingerprints=new Map(mission.nodes.map(node=>[node.key,fingerprint(node)]));
      const nodes=visibleNodes();
      if(!nodes.some(node=>node.key===selectedKey))selectedKey=mission.currentKey||mission.nextKey||nodes[0]?.key||null;
      selectionHistory=selectionHistory.filter(key=>byKey.has(key));
      document.title=plan.title;
      $('title').textContent=plan.title;$('title').title=plan.title;
      $('demo-badge').hidden=!/演示|\bdemo\b/i.test(plan.title);
      $('done-count').textContent=String(mission.counts.done);
      $('total-count').textContent=String(mission.counts.total);
      $('completion').setAttribute('aria-label',t('{view}：{done} / {total} 项开发完成',{view:streamLabel(selectedView),done:mission.counts.done,total:mission.counts.total}));
      const current=byKey.get(mission.currentKey),next=byKey.get(mission.nextKey);
      renderPointer('current-title',current,t('本图暂无进行中的任务'));
      renderPointer('next-title',next,t('尚未确定下一任务'));
      $('next-label').textContent=mission.nextKind==='sequence'?t('顺序下一项'):t('下一任务');
      $('current-task').disabled=!current;$('next-task').disabled=!next;
      renderWorkspaces();renderMap(changed);renderChapters();renderMeters();renderDossier();renderHistory();
      $('empty-map').hidden=nodes.length>0;
      if(!nodes.length){
        const sourceError=plan.planningState==='source-error'||plan.sources.some(source=>source.state==='error'),hasPlan=plan.sources.some(source=>source.mode==='plan');
        const specOnly=plan.planningState==='spec-only'||!hasPlan&&plan.sources.some(source=>source.mode==='spec'),historyOnly=plan.planningState==='history-only'||!hasPlan&&!!plan.history?.length;
        $('empty-title').textContent=sourceError?t('文档来源读取失败'):specOnly?t('已有规范，尚无任务记录'):historyOnly?t('当前仅有变更历史'):t('尚无可用的开发计划');
        $('empty-copy').textContent=sourceError?t('查看来源状态，核对文档路径和格式。读取恢复后，内容会自动出现。'):specOnly?t('在“来源”中查看规范与需求。根据已确认的范围整理实施步骤并记录状态后，任务才会出现在地图上。规范内容不会自动标记为已开发或已验收。'):historyOnly?t('变更记录可在“变更记录”中查看。先从已有记录整理当前目标与最近 2–3 个步骤；确认并保存计划后，重新打开看板即可显示任务。'):hasPlan?t('当前文档没有可识别的任务。可先整理一个当前目标和最近 2–3 个步骤，再更新计划文档。'):t('可先从 README、TODO 和变更记录整理当前目标与最近 2–3 个步骤；确认后保存为计划文档并重新打开看板。此看板只展示记录。');
        $('empty-sources').textContent=specOnly?t('查看来源与规范'):t('查看来源状态');
        $('empty-sources').hidden=false;
      }
      if(initial&&nodes.length){
        home({animate:false});
        initial=false;
        document.body.classList.add('map-ready');
        setTimeout(()=>document.body.classList.remove('map-ready'),1400);
      }else applyCamera();
      document.body.classList.toggle('is-empty',!nodes.length);
      if(!linked){linked=true;applyHash();}
      if(changed.length)announce(t('已更新 {count} 项任务：{tasks}',{count:changed.length,tasks:listJoin(changed.slice(0,4).map(key=>byKey.get(key).id))}));
      return changed.length;
    }
    async function sync(){
      if(busy)return;
      busy=true;$('retry').disabled=true;
      try{
        const response=await fetch('/api/plan',{cache:'no-store',signal:AbortSignal.timeout(4000)});
        if(!response.ok)throw new Error(t('读取失败'));
        const incoming=await response.json();
        if(!Array.isArray(incoming.items)||!Array.isArray(incoming.sources)||!incoming.revision)throw new Error(t('格式不完整'));
        const languageChanged=setLanguage(incoming.language),changed=incoming.revision!==revision||languageChanged;
        plan=incoming;
        if(changed){
          revision=incoming.revision;errorDismissed=false;
          if(!render())announce(t('项目记录已更新。'));
        }else if(stale)announce(t('已恢复同步。'));
        lastSuccess=Date.now();stale=false;
        renderSources();
        $('last-sync').textContent=t('最近同步 {time}',{time:new Date(incoming.syncedAt).toLocaleTimeString(localeFor(language),{hour12:false})});
      }catch{
        setStale(plan?t('本地服务暂时无法连接；保留上次任务状态，每 2 秒自动重试。'):t('无法连接本地看板服务；每 2 秒自动重试，请检查启动命令。'));
      }finally{busy=false;$('retry').disabled=false;}
    }

    // ---------- Address state: #task=ID&view=workstream ----------
    function syncHash(){
      if(!linked)return;
      const params=new URLSearchParams(),node=byKey.get(selectedKey);
      if(selectedView!=='all')params.set('view',selectedView);
      if(node&&!$('dossier').hidden)params.set('task',node.id);
      if(!$('utility').hidden)params.set('panel',utilityTab);
      const hash=params.toString();
      if(hash!==location.hash.slice(1))history.replaceState(null,'',hash?'#'+hash:location.pathname+location.search);
    }
    function applyHash(){
      const params=new URLSearchParams(location.hash.slice(1)),view=params.get('view'),task=params.get('task');
      if(view&&mission?.nodes.some(node=>streamOf(node)===view)&&view!==selectedView){setView(view,{reset:false});home({animate:false});}
      const target=task&&visibleNodes().concat(mission?.nodes||[]).find(node=>node.id===task);
      if(target&&(target.key!==selectedKey||$('dossier').hidden))locate(target.key,{open:true,record:false,animate:false});
      const panel=params.get('panel');
      if(!target&&['tasks','sources','history'].includes(panel)&&($('utility').hidden||utilityTab!==panel))openUtility(panel);
    }

    // ---------- Controls ----------
    $('back-button').addEventListener('click',()=>{const previous=selectionHistory.pop();if(previous)locate(previous,{record:false,open:!$('dossier').hidden});});
    $('home-button').addEventListener('click',()=>home());
    $('zoom-in').addEventListener('click',()=>zoomBy(1.25,null,true));
    $('zoom-out').addEventListener('click',()=>zoomBy(.8,null,true));
    $('fit-button').addEventListener('click',()=>frame(visibleNodes().map(node=>node.key),{maxZoom:1.1}));
    $('locate-button').addEventListener('click',()=>{const key=mission?.currentKey||mission?.nextKey||selectedKey;if(!byKey.has(key))return;revealTarget(byKey.get(key));selectedKey=key;updateSelection();centerOn(key,{zoom:Math.max(camera.z,mobile()?.7:.86)});});
    $('legend-button').addEventListener('click',()=>setLegend($('legend').hidden));
    $('current-task').addEventListener('click',()=>locate(mission?.currentKey,{open:true}));
    $('next-task').addEventListener('click',()=>locate(mission?.nextKey,{open:true}));
    $('close-dossier').addEventListener('click',()=>closeDossier());
    $('close-utility').addEventListener('click',()=>closeUtility(true));
    $('search-button').addEventListener('click',()=>$('utility').hidden||utilityTab!=='tasks'?openUtility('tasks',true):closeUtility(true));
    $('source-button').addEventListener('click',()=>$('utility').hidden||utilityTab!=='sources'?openUtility('sources'):closeUtility(true));
    $('list-button').addEventListener('click',()=>$('utility').hidden||utilityTab!=='tasks'?openUtility('tasks'):closeUtility());
    $('connection-button').addEventListener('click',()=>openUtility('sources'));
    $('empty-sources').addEventListener('click',()=>openUtility('sources'));
    $('retry').addEventListener('click',()=>{errorDismissed=false;sync();});
    $('dismiss-error').addEventListener('click',()=>{errorDismissed=true;$('error').hidden=true;});
    $('search').addEventListener('input',applyFilter);
    for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{
      filter=button.dataset.filter;
      for(const sibling of document.querySelectorAll('[data-filter]'))sibling.setAttribute('aria-pressed',String(sibling===button));
      applyFilter();
    });
    for(const button of document.querySelectorAll('[data-panel]')){
      button.addEventListener('click',()=>openUtility(button.dataset.panel));
      button.addEventListener('keydown',event=>{
        if(!['ArrowLeft','ArrowRight'].includes(event.key))return;
        event.preventDefault();
        const tabs=[...document.querySelectorAll('[data-panel]')].filter(node=>!node.hidden),next=tabs[(tabs.indexOf(button)+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];
        openUtility(next.dataset.panel);next.focus();
      });
    }

    // Pointer: drag to pan, two fingers to pinch. Mouse wheels zoom at the cursor, trackpads pan.
    const viewport=$('map-viewport'),pointers=new Map();
    let drag=null,pinch=null,suppressClick=false;
    viewport.addEventListener('pointerdown',event=>{
      if(event.pointerType==='mouse'&&event.button!==0)return;
      stopFlight();autoFrame=null;
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pointers.size===2){
        const [a,b]=[...pointers.values()];
        pinch={distance:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,origin:{...camera}};
        drag=null;suppressClick=true;
        return;
      }
      if(event.target.closest('.stage'))return;
      drag={id:event.pointerId,x:event.clientX,y:event.clientY,originX:camera.x,originY:camera.y,moved:false};
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove',event=>{
      if(!pointers.has(event.pointerId))return;
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if(pinch&&pointers.size===2){
        const [a,b]=[...pointers.values()],z=clamp(pinch.origin.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.distance,ZOOM.min,ZOOM.max),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
        camera={x:cx-(pinch.cx-pinch.origin.x)/pinch.origin.z*z,y:cy-(pinch.cy-pinch.origin.y)/pinch.origin.z*z,z};
        applyCamera();
        return;
      }
      if(!drag||event.pointerId!==drag.id)return;
      const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
      if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;
      camera.x=drag.originX+dx;camera.y=drag.originY+dy;
      applyCamera();
    });
    function endPointer(event){
      pointers.delete(event.pointerId);
      if(pinch&&pointers.size<2){pinch=null;setTimeout(()=>suppressClick=false,0);}
      if(!drag||event.pointerId!==drag.id)return;
      suppressClick=drag.moved;drag=null;
      viewport.classList.remove('dragging');
      setTimeout(()=>suppressClick=false,0);
    }
    // Focus can scroll a clipped container; fold any such scroll back into the camera.
    viewport.addEventListener('scroll',()=>{
      if(!viewport.scrollLeft&&!viewport.scrollTop)return;
      camera.x-=viewport.scrollLeft;camera.y-=viewport.scrollTop;viewport.scrollLeft=0;viewport.scrollTop=0;
      applyCamera();
    });
    viewport.addEventListener('pointerup',endPointer);
    viewport.addEventListener('pointercancel',endPointer);
    viewport.addEventListener('wheel',event=>{
      event.preventDefault();stopFlight();
      const notched=event.deltaMode===1||event.deltaX===0&&Math.abs(event.wheelDeltaY||0)>=120&&(event.wheelDeltaY||0)%120===0;
      if(event.ctrlKey||event.metaKey||notched){
        const delta=clamp(event.deltaMode===1?event.deltaY*30:event.deltaY,-120,120);
        zoomBy(Math.exp(-delta*(notched?.0024:.011)),{x:event.clientX,y:event.clientY});
      }else{autoFrame=null;camera.x-=event.deltaX;camera.y-=event.deltaY;applyCamera();}
    },{passive:false});

    // Keyboard: arrows walk between plates when one has focus, otherwise they pan the map.
    function neighbour(key,direction){
      const origin=positions.get(key),horizontal=['ArrowLeft','ArrowRight'].includes(direction);
      let best=null,score=Infinity;
      for(const node of visibleNodes()){
        if(node.key===key||!matches(node))continue;
        const point=positions.get(node.key),dx=point.x-origin.x,dy=point.y-origin.y;
        const forward=direction==='ArrowRight'?dx:direction==='ArrowLeft'?-dx:direction==='ArrowDown'?dy:-dy,sideways=horizontal?Math.abs(dy):Math.abs(dx);
        if(forward<=8)continue;
        const value=forward+sideways*2.2;
        if(value<score){score=value;best=node.key;}
      }
      return best;
    }
    document.addEventListener('pointerdown',()=>{keyboardNavigation=false;},{capture:true});
    document.addEventListener('keydown',event=>{
      if(event.key==='Tab')keyboardNavigation=true;
      if(event.key==='Escape'){
        if(!$('utility').hidden)closeUtility(true);
        else if(!$('dossier').hidden)closeDossier();
        else if(!$('legend').hidden)setLegend(false);
        return;
      }
      if(event.target.matches('input,select,textarea')||event.target.closest('.panel'))return;
      if(event.key==='/'&&!event.ctrlKey&&!event.metaKey){event.preventDefault();openUtility('tasks',true);return;}
      if(event.key==='Home'){event.preventDefault();home({animate:false});return;}
      if(['+','=','-','_'].includes(event.key)&&!event.ctrlKey&&!event.metaKey){event.preventDefault();zoomBy(['+','='].includes(event.key)?1.2:1/1.2);return;}
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
        event.preventDefault();
        const stage=event.target.closest('.stage');
        if(stage){
          keyboardNavigation=true;
          const next=neighbour(stage.dataset.key,event.key);
          if(next)nodeElements.get(next)?.focus({preventScroll:true});
          return;
        }
        stopFlight();autoFrame=null;
        const amount=event.shiftKey?220:90;
        if(event.key==='ArrowLeft')camera.x+=amount;
        if(event.key==='ArrowRight')camera.x-=amount;
        if(event.key==='ArrowUp')camera.y+=amount;
        if(event.key==='ArrowDown')camera.y-=amount;
        applyCamera();
      }
    });
    let resizeTimer;
    window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(initial)return;if(autoFrame)autoFrame();else if(selectedKey&&!$('dossier').hidden)ensureVisible(selectedKey,{animate:false});},150);});
    window.addEventListener('hashchange',()=>{if(linked)applyHash();});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)return;
      if(lastSuccess&&Date.now()-lastSuccess>6000)setStale(t('正在重新读取本地任务状态…'));
      sync();
    });
    setInterval(()=>{
      if(lastSuccess&&Date.now()-lastSuccess>6000&&!stale)setStale(t('尚未获得新的同步结果；保留上次状态。'));
      if(!document.hidden)sync();
    },2000);

    renderLegend();
    {let stored=null;try{stored=localStorage.getItem('vmt-legend');}catch{}setLegend(stored==='1',false);}
    applyCamera();
    sync();
  </script>
</body>
</html>
